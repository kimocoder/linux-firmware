name: Update & Strip Firmware

on:
  schedule:
    # Run every Monday at 4:00 AM UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      upstream_url:
        description: 'Upstream git repository URL'
        required: false
        default: 'https://gitlab.com/kernel-firmware/linux-firmware.git'
      branch:
        description: 'Upstream git branch'
        required: false
        default: 'main'
      dry_run:
        description: 'Dry run check without committing changes'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-firmware:
    name: Update Firmware Blobs from Upstream
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Execute Firmware Update & Stripping
        run: |
          UPSTREAM_URL="${{ github.event.inputs.upstream_url || 'https://gitlab.com/kernel-firmware/linux-firmware.git' }}"
          BRANCH="${{ github.event.inputs.branch || 'main' }}"
          
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi
          
          python3 update_firmware.py --upstream-url "$UPSTREAM_URL" --branch "$BRANCH" $EXTRA_FLAGS

      - name: Validate WHENCE Manifest Integrity
        run: |
          python3 check_whence.py

      - name: Check for repository changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
            echo "Working tree has updates from upstream linux-firmware."
          else
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
            echo "No firmware updates detected."
          fi

      - name: Create Pull Request
        if: steps.git-check.outputs.changes_detected == 'true' && github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: |
            firmware: Update & sync firmwares from upstream linux-firmware

            Automated firmware update and stripping job. Updated binary blobs,
            symlinks, and WHENCE manifest while preserving project firmwares.

            Signed-off-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
            Assisted-by: GitHub Action CI
          title: "firmware: Sync and update firmwares from upstream linux-firmware"
          body: |
            ### Automated Upstream Firmware Sync

            This PR was automatically generated by the **Update & Strip Firmware** workflow.

            - **Upstream Source**: `linux-firmware` (`main` branch)
            - **Scope**: Wi-Fi, Bluetooth, USB serial, SDR, DVB, TV tuners & network firmwares packed in this project
            - **Validation**: Passed `check_whence.py` manifest verification

            Please review the changes and merge when ready.
          branch: "automation/update-firmware"
          delete-branch: true
          signoff: true
